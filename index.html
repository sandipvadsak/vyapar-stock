<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="logo.svg">
<title>Vyapar Stock</title>
<style>
:root{--side:#13204b;--side2:#1d2d63;--ink:#16203a;--mute:#66708a;--line:#e1e6f0;--bg:#f4f6fb;--card:#fff;--stripe:#edf2f9;
  --acc:#7c3aed;--acc-d:#5b21b6;--blue:#2563eb;--blue-d:#1d4ed8;--gold:#f5b301;--gold-d:#c98f00;--slate:#475569;--slate-d:#334155;
  --good:#0f9d58;--bad:#dc2626;--warn:#b7791f}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 "Segoe UI",system-ui,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.hide{display:none!important}
#app{display:grid;grid-template-columns:208px 1fr;grid-template-rows:auto 1fr;height:100%}
#hdr{grid-column:1/-1;background:#fff;display:flex;align-items:center;gap:12px;padding:10px 20px;box-shadow:0 2px 8px rgba(20,30,70,.10);z-index:2;flex-wrap:wrap}
#hdr .logo{font-size:23px;font-weight:800;margin-right:auto;letter-spacing:.2px;white-space:nowrap}
#hdr .logo{display:flex;align-items:center}
.lg{width:34px;height:34px;margin-right:10px;flex:none}
.lg.big{width:44px;height:44px;vertical-align:-11px;margin-right:12px}
#hdr .logo span{margin-left:.3em}
#hdr .logo span{color:var(--acc)}
.ver{display:inline-block;font-size:12px;font-weight:800;line-height:1;color:#fff;background:var(--acc);padding:4px 9px;border-radius:999px;margin-left:.6em;letter-spacing:0;vertical-align:middle}
.ver:empty{display:none}
#hdr .who{font-size:15.5px;white-space:nowrap}
#hdr .live{display:flex;align-items:center;gap:7px;color:var(--mute);white-space:nowrap}
#hdr .live i{width:13px;height:13px;border-radius:50%;background:#22c55e;display:inline-block}
#side{background:var(--side);color:#e6ebfa;overflow:auto;padding-top:10px}
#side a{display:flex;align-items:center;gap:10px;padding:12px 16px;margin:2px 10px 2px 0;color:inherit;text-decoration:none;font-weight:700;border-radius:0 8px 8px 0}
#side a:hover{background:var(--side2)}
#side a.on{background:var(--acc);color:#fff;box-shadow:0 3px 0 var(--acc-d)}
#side a i{font-style:normal;width:20px;text-align:center}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#top{padding:18px 24px 6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#top h1{font-size:20px;font-weight:800;margin-right:auto}
#top h1::before{content:"✚";color:var(--acc);margin-right:10px}
#view{flex:1;overflow:auto;padding:12px 24px 22px}
.btn{border:none;background:var(--slate);color:#fff;font-weight:700;border-radius:9px;padding:8px 15px;cursor:pointer;white-space:nowrap;
  box-shadow:0 3px 0 var(--slate-d);text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn:disabled{opacity:.6;cursor:default}
.btn.sale,.btn.pri{background:var(--acc);box-shadow:0 3px 0 var(--acc-d)}
.btn.buy{background:var(--blue);box-shadow:0 3px 0 var(--blue-d)}
.btn.gold{background:var(--gold);box-shadow:0 3px 0 var(--gold-d);color:#2b2200}
.btn.lite{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line),0 3px 0 #cfd6e4}
.btn.wa{background:#16a34a;box-shadow:0 3px 0 #0f7a36;color:#fff}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn.danger{background:var(--slate);box-shadow:0 3px 0 var(--slate-d)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--card);border-radius:12px;padding:15px 16px;box-shadow:0 1px 4px rgba(20,30,70,.10);border-left:5px solid var(--acc)}
.card:nth-child(even){border-left-color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-bottom:20px}
.kpi{position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:12px;row-gap:2px;background:#fff;border-radius:18px;padding:18px;
  border:1px solid #e6e9f2;box-shadow:0 1px 2px rgba(20,30,70,.06),0 10px 24px -12px rgba(20,30,70,.22);transition:transform .15s,box-shadow .15s}
.kpi::after{content:"";position:absolute;right:-34px;top:-34px;width:120px;height:120px;border-radius:50%;background:var(--c1);opacity:.10}
.kpi .ic{grid-row:1;grid-column:1;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,var(--c1),var(--c2));
  box-shadow:0 8px 16px -6px var(--c1)}
.kpi .tx{display:contents}
.kpi .k{grid-row:1;grid-column:2;position:relative;z-index:1;font-size:12px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--mute)}
.kpi .v{grid-row:2;grid-column:1/-1;position:relative;z-index:1;font-size:26px;font-weight:800;line-height:1.2;margin-top:12px;color:var(--c3);white-space:nowrap}
.kpi .sub{grid-row:3;grid-column:1/-1;position:relative;z-index:1;font-size:12px;font-weight:600;color:var(--mute);margin-top:2px}
.kpi .go{grid-row:1;grid-column:3;font-size:24px;font-weight:800;color:var(--c1);opacity:.55;position:relative;z-index:1}
.kpi.tap{cursor:pointer}
.kpi.tap:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(20,30,70,.08),0 18px 30px -12px rgba(20,30,70,.32)}
.kpi.tap:hover .go{opacity:1}
.kpi.green{--c1:#10b981;--c2:#059669;--c3:#047857}
.kpi.rose{--c1:#f43f5e;--c2:#e11d48;--c3:#be123c}
.kpi.gold{--c1:#f5b301;--c2:#d99000;--c3:#8a5a00}
.kpi.blue{--c1:#3b82f6;--c2:#2563eb;--c3:#1d4ed8}
.kpi.amber{--c1:#fb923c;--c2:#ea580c;--c3:#c2410c}
.kpi.hero{grid-column:span 2;--c1:#a78bfa;--c2:#7c3aed;border:none;color:#fff;padding:22px 22px 22px 20px;
  background:linear-gradient(120deg,#13204b 0%,#3b2a8c 55%,#7c3aed 100%);box-shadow:0 16px 32px -14px rgba(91,33,182,.65)}
.kpi.hero::after{background:#fff;opacity:.08;width:220px;height:220px;right:-70px;top:-90px}
.kpi.hero .ic{width:54px;height:54px;font-size:26px;background:rgba(255,255,255,.16);box-shadow:none;border:1px solid rgba(255,255,255,.25)}
.kpi.hero .k{color:#d9d2ff}
.kpi.hero .v{color:#fff;font-size:36px}
.kpi.hero .sub{color:#d9d2ff;font-size:13px}
.kpi.hero .go{color:#fff}
@media (min-width:1500px){
  .kpis{display:flex;flex-wrap:nowrap;gap:14px}
  .kpi{flex:1 1 0;min-width:0;padding:16px 14px}
  .kpi.hero{flex:1.75 1 0;padding:18px 18px}
  .kpi .ic{width:42px;height:42px;font-size:20px;border-radius:13px}
  .kpi .k{font-size:11.5px;letter-spacing:.5px}
  .kpi .v{font-size:clamp(17px,1.2vw,26px)}
  .kpi.hero .v{font-size:clamp(26px,1.9vw,36px)}
  .kpi .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi.hero .sub{white-space:normal}
  .kpi .go{font-size:20px}
}
@media (max-width:560px){.kpi.hero{grid-column:span 1}.kpi.hero .v{font-size:28px}}
.card.tap{cursor:pointer}
.card.tap:hover{box-shadow:0 3px 10px rgba(20,30,70,.18);transform:translateY(-1px)}
.card .sub{color:var(--mute);font-size:12px;font-weight:600;margin-top:5px}
.card .k{color:var(--mute);font-size:12.5px;font-weight:600}
.card .v{font-size:21px;font-weight:800;margin-top:4px}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mute{color:var(--mute)}
.panel{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(20,30,70,.10)}
.panel>.hd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.panel>.hd h2{font-size:15.5px;font-weight:800;margin-right:auto}
.tw{overflow:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:11px 14px;text-align:left;white-space:nowrap}
th{font-size:13px;color:var(--slate);font-weight:700;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0}
tbody tr:nth-child(odd){background:var(--stripe)}
td.r,th.r{text-align:right}
td.r{font-weight:700}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:#e3dcfb}
.empty{padding:28px;text-align:center;color:var(--mute)}
.split{display:grid;grid-template-columns:310px 1fr;gap:16px;height:100%;min-height:0}
.split>.list{display:flex;flex-direction:column;min-height:0}
.split>.list .rows{overflow:auto;flex:1}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;cursor:pointer;font-weight:600}
.row:nth-child(odd){background:var(--stripe)}
.row:hover{background:#e3dcfb}
.row.on{background:var(--acc);color:#fff}
.row.on span{color:#fff!important}
.row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:#f7f8fc}
.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 4px;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--slate)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.selbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line);background:#fff}
.selbar.active{background:#fff4e5;border-bottom-color:#fdba74}
.selbar.active #ibulk{background:#c2410c;box-shadow:0 3px 0 #9a3412;color:#fff}
#ibulk2{background:#c2410c;box-shadow:0 3px 0 #9a3412}
.selbar label.c{padding:0;font-weight:700;font-size:13px;cursor:pointer}
.selbar input,.row .isel{width:17px;height:17px;accent-color:var(--acc);cursor:pointer;flex:none}
.row .isel{margin:2px 10px 0 0}
.row .n{flex:1}
.row.on .isel{accent-color:#fff}
.lhead{display:flex;justify-content:space-between;gap:8px;padding:5px 10px;border-bottom:1px solid var(--line);background:#f3f5fb}
.lhead button{border:none;background:none;padding:4px 6px;border-radius:7px;font-size:11.5px;font-weight:800;letter-spacing:.4px;color:var(--mute);cursor:pointer;white-space:pre}
.lhead button:hover{background:#e6e9f5;color:var(--ink)}
.lhead button.on{color:var(--acc-d)}
.row.off .n{color:var(--mute)}
.row em{font-style:normal;font-size:11px;font-weight:700;background:#e2e8f0;color:#475569;border-radius:8px;padding:1px 7px;margin-left:6px}
.row.on em{background:rgba(255,255,255,.25);color:#fff}
.chip.offchip{background:#e2e8f0;color:#334155}
.split>.det{display:flex;flex-direction:column;gap:16px;min-height:0;overflow:auto;padding-bottom:4px}
.split>.det>.panel{flex-shrink:0}
.hero>.hd{align-items:center;border-bottom:none;padding:12px 16px 4px;gap:8px}
.hero .ttl{margin-right:auto;min-width:0}
.hero .ttl h2{font-size:21px;font-weight:800;margin:0}
.hero.near>.hd{justify-content:flex-start}
.hero.near .ttl{margin-right:6px}
.redit{flex:none;border:1px solid transparent;background:none;border-radius:8px;width:30px;height:28px;margin:-4px -6px -4px 6px;cursor:pointer;font-size:14px;line-height:1;opacity:.35}
.row:hover .redit,.row.on .redit{opacity:1;background:#fff;border-color:#d7dcea}
.redit:hover{background:#f3edff!important;border-color:var(--acc)!important}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.chip{background:#eef1f8;color:#3b4763;border-radius:20px;padding:3px 11px;font-size:12.5px;font-weight:600}
.chip.lowchip{background:#fde2e2;color:#b91c1c}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;padding:8px 16px 14px}
.stat{display:flex;gap:12px;align-items:center;border-radius:12px;padding:13px 14px;background:#f5f3ff;border:1px solid #e4dcfb}
.stat i{font-style:normal;font-size:22px;width:44px;height:44px;border-radius:11px;display:grid;place-items:center;background:#fff;box-shadow:0 2px 0 rgba(20,30,70,.10)}
.stat span{display:block;color:var(--mute);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.stat b{font-size:21px;font-weight:800;color:var(--acc-d)}
.stat b small{font-size:13px;font-weight:700;color:var(--mute)}
.stat b.wrap{font-size:13.5px;font-weight:600;color:var(--ink);white-space:normal}
.stat.blue{background:#eef4ff;border-color:#d5e3fd}.stat.blue b{color:var(--blue-d)}
.stat.green{background:#eafaf1;border-color:#cdeedb}.stat.green b{color:#0b7a43}
.stat.gold{background:#fff8e1;border-color:#f8e7ad}.stat.gold b{color:#8a5a00}
.stat.red{background:#fdecec;border-color:#f8cfcf}.stat.red b{color:#b91c1c}
.facts{display:flex;gap:28px;flex-wrap:wrap;padding:13px 16px}
.facts div span{display:block;color:var(--mute);font-size:12px;font-weight:600}
.facts div b{font-size:15.5px}
input,select,textarea{border:1px solid #cdd4e3;border-radius:9px;padding:9px 11px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #cdbcf8;border-color:var(--acc)}
.search{flex:1;min-width:120px}
.fbar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;padding:12px 16px;background:#f7f8fc;border-bottom:1px solid var(--line)}
.fbar label.f{min-width:130px}
.fbar label.grow{flex:1;min-width:200px}
.fbar .btn{margin-bottom:3px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;border-radius:10px;padding:2px 9px;font-size:12px;font-weight:700;background:#e6eaf3}
.tag.acct{background:#13204b;color:#fff;letter-spacing:.4px;padding:3px 11px}
.achips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:4px 18px 14px}
.achips b{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px;margin-right:4px}
.achips button{--ac:#13204b;border:1px solid #d7dcea;border-left:6px solid var(--ac);background:#fff;border-radius:12px;padding:6px 12px 6px 10px;font-weight:800;cursor:pointer;color:var(--ac);text-align:left;line-height:1.25}
.achips button i{display:none}
.achips button small{display:block;font-weight:600;font-size:11.5px;color:var(--mute)}
.achips button:hover{box-shadow:0 2px 8px rgba(20,30,70,.16)}
.achips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.achips button.on small{color:rgba(255,255,255,.85)}
.achips button[data-acct=""]{border-left-width:1px;color:var(--ink)}
.tag.sale{background:#ebe3fd;color:#5b21b6}.tag.purchase{background:#dde9fd;color:#1d4ed8}
.tag.sale_return,.tag.purchase_return{background:#fff0cc;color:#8a5a00}
.tag.payment_in{background:#dcf5e7;color:#0c7446}.tag.payment_out{background:#e2e8f0;color:#334155}
dialog{border:none;border-radius:14px;padding:0;width:min(900px,96vw);max-height:94vh;box-shadow:0 20px 60px rgba(15,25,60,.4)}
dialog::backdrop{background:rgba(15,22,50,.5)}
dialog form{display:flex;flex-direction:column;max-height:94vh}
dialog .dh{padding:14px 18px;background:var(--side);color:#fff;display:flex;align-items:center}
dialog .dh h2{font-size:16px;margin-right:auto}
dialog .db{padding:16px 18px;overflow:auto}
dialog .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;align-items:center}
dialog .err{color:var(--bad);margin-right:auto;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mute);font-weight:600}
label.f input,label.f select,label.f textarea{font-size:14px;color:var(--ink);font-weight:400}
label.c{display:flex;gap:8px;align-items:center;padding:5px 0}
.lines input{width:100%}
.lines td{padding:5px 6px}
.lines tbody{counter-reset:ln}
.lines tbody tr{counter-increment:ln}
.lines td.no{width:40px;text-align:center;font-weight:700;color:var(--mute)}
.lines td.no::before{content:counter(ln)}
.lines td.la{font-weight:800}
.sumbar{position:sticky;top:-16px;z-index:6;margin:-16px -18px 14px;padding:12px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;
  background:#13204b;box-shadow:0 6px 14px -8px rgba(10,16,45,.6)}
.sf{background:#22306a;border:1px solid #2f3f80;border-radius:12px;padding:8px 14px;min-width:96px;color:#fff;display:flex;flex-direction:column;justify-content:center}
.sf span{font-size:10.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:#b9c3ea}
.sf b{font-size:16.5px;font-weight:800;line-height:1.25;white-space:nowrap}
.sf.hi{background:#f5b301;border-color:#f5b301}
.sf.hi span{color:#5a4700}
.sf.hi b{color:#2b2200}
.sf.key{background:#fff;border-color:#fff}
.sf.key span{color:var(--mute)}
.sf.key b{color:#13204b;font-size:19px}
.sf.need{border-color:#fb923c;background:#3a2a1e}
.sf.need b{color:#fdba74}
select.need{border-color:#ea580c;box-shadow:0 0 0 2px #fed7aa}
.sf.sm{margin-left:auto;background:none;border:none;padding-right:0}
.sf.sm b{font-size:13px;font-weight:600;color:#dfe5fb}
table.stick th{position:sticky;top:calc(var(--sumh,0px) - 16px);z-index:4;background:#f3f5fb;box-shadow:0 1px 0 var(--line)}
@media (max-width:600px){.sf{min-width:0;padding:6px 10px}.sf b{font-size:14.5px}.sf.sm{display:none}}
.bundle{display:flex;gap:14px;row-gap:22px;align-items:flex-end;flex-wrap:wrap;margin-top:12px;padding:12px;border-radius:12px;background:#f7f8fc;border:1px solid var(--line)}
.btitle{flex-basis:100%;font-weight:800;font-size:14px;margin-bottom:6px}
.bgrp{display:flex;gap:10px;align-items:flex-end;flex:1 1 100%;min-width:300px;padding:26px 12px 12px;border-radius:12px;border:2px solid;position:relative}
.bgrp select{min-width:0;width:100%}
.bgrp label.f:first-of-type{flex:1.2;min-width:0}
.bgrp label.f:nth-of-type(2){flex:1;min-width:0}
.bwith{align-self:flex-end;padding:0 4px 9px;font-weight:700;white-space:nowrap;line-height:1.2}
.bwith small{display:block;font-weight:600;font-size:11.5px;color:var(--mute)}
.bgrp.cep .bwith b{color:var(--acc-d)}.bgrp.dcep .bwith b{color:var(--blue-d)}
.bgrp label.f{font-weight:800}
.bgrp .btn{margin-bottom:3px;padding:8px 14px}
.bundle #b_msg{flex-basis:100%;margin-top:-10px}
.btag{position:absolute;top:-19px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#fff;font-weight:800;font-size:19px;letter-spacing:1px;padding:5px 30px;border-radius:20px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.bgrp.cep{background:#f3edff;border-color:var(--acc)}.bgrp.cep label.f{color:var(--acc-d)}.bgrp.cep .btag{background:var(--acc)}
.bgrp.cep select,.bgrp.cep input{border-color:#b9a2f3}
.bgrp.dcep{background:#e8f1ff;border-color:var(--blue)}.bgrp.dcep label.f{color:var(--blue-d)}.bgrp.dcep .btag{background:var(--blue)}
.bgrp.dcep select,.bgrp.dcep input{border-color:#9dbcf5}
#ipick{position:fixed;z-index:50;background:#fff;border:1px solid #c9d0e2;border-radius:10px;box-shadow:0 14px 34px rgba(15,25,60,.28);max-height:300px;overflow:auto;font-size:13.5px}
#ipick .ph,#ipick .pr{display:grid;grid-template-columns:minmax(0,1fr) repeat(var(--pc,3),110px);gap:10px;padding:8px 12px;align-items:center}
#ipick .ph{position:sticky;top:0;background:#f3f5fb;font-size:11.5px;font-weight:800;color:var(--mute);letter-spacing:.5px;border-bottom:1px solid var(--line)}
#ipick .pr{cursor:pointer;border-bottom:1px solid #eef1f7;font-weight:600}
#ipick .pr:hover{background:#f3edff}
#ipick .pr.on{background:var(--acc);color:#fff}
#ipick .pr.on .good,#ipick .pr.on .bad,#ipick .pr.on small{color:#fff}
#ipick .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ipick .pn small{color:var(--mute);font-weight:600;margin-left:6px}
#ipick .r{text-align:right}
#ipick .pe{padding:14px;text-align:center;color:var(--mute)}
.totals{display:flex;justify-content:flex-end;gap:22px;align-items:center;margin-top:12px;flex-wrap:wrap}
.totals b{font-size:18px}
#login{min-height:100%;display:grid;place-items:center;padding:20px;background:var(--side)}
#login .box{background:#fff;border-radius:16px;padding:28px;width:min(390px,100%);display:flex;flex-direction:column;gap:13px;box-shadow:0 6px 0 var(--acc-d)}
#login h1{font-size:25px;font-weight:800}
#login h1 span{color:var(--acc)}
#login .msg{min-height:20px;font-size:13px;color:var(--bad)}
#askdlg{width:min(440px,94vw);border-radius:16px}
.askbox{padding:22px 22px 18px}
.askbox h2{font-size:18px;font-weight:800;margin-bottom:8px}
.askbox p{margin:0 0 20px;color:#3b4763;font-size:14.5px;line-height:1.5}
.askbtns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--side);color:#fff;font-weight:600;padding:10px 18px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
#toast.on{opacity:1}
@media (max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  #hdr{padding:8px 12px;gap:8px}
  #hdr .logo{font-size:19px}
  #hdr .live{display:none}
  #side{display:flex;overflow-x:auto;padding:6px 6px 8px}
  #side a{margin:0 3px;border-radius:8px;padding:9px 12px;white-space:nowrap}
  .split{grid-template-columns:1fr;height:auto}
  .split>.list .rows{max-height:38vh}
  #top{padding:12px 12px 4px}
  #view{padding:10px 12px 18px}
}
</style>
</head>
<body>
<div id="login" class="hide">
  <form class="box" id="loginForm">
    <h1><img class="lg big" src="logo.svg" alt="">Vyapar <span>Stock</span><small class="ver"></small></h1>
    <div class="mute" id="loginSub">Sign in to continue</div>
    <label class="f hide" id="nameWrap">Your name<input id="lname" autocomplete="name"></label>
    <label class="f">Email<input id="lemail" type="email" required autocomplete="username"></label>
    <label class="f">Password<input id="lpass" type="password" required minlength="6" autocomplete="current-password"></label>
    <div class="msg" id="lmsg"></div>
    <button class="btn pri" id="lgo">SIGN IN</button>
    <button class="btn lite" type="button" id="lswap">Create a new account</button>
  </form>
</div>

<div id="app" class="hide">
  <header id="hdr">
    <div class="logo"><img class="lg" src="logo.svg" alt="">Vyapar <span>Stock</span><small class="ver"></small></div>
    <div class="who">👤 <b id="whoName"></b> <span class="mute" id="whoRole"></span></div>
    <div class="live"><i></i> Online – live sync</div>
    <button class="btn gold sm" id="refreshBtn">⟳ Refresh</button>
    <button class="btn pri sm" id="logout">⏻ Logout</button>
  </header>
  <nav id="side"><div id="menu" style="display:contents"></div></nav>
  <div id="main">
    <div id="top"><h1 id="title"></h1><div id="actions" style="display:contents"></div></div>
    <div id="view"></div>
  </div>
</div>

<dialog id="dlg"><form id="dform" method="dialog">
  <div class="dh"><h2 id="dtitle"></h2><button class="btn lite sm" type="button" id="dclose">✕</button></div>
  <div class="db" id="dbody"></div>
  <div class="df"><span class="err" id="derr"></span><span id="dextra" style="display:contents"></span><button class="btn pri" id="dsave">SAVE</button></div>
</form></dialog>
<dialog id="askdlg"><div class="askbox">
  <h2 id="asktitle"></h2><p id="askmsg"></p>
  <div class="askbtns"><button class="btn lite" type="button" id="askno">NO, GO BACK</button><button class="btn pri" type="button" id="askok">YES</button></div>
</div></dialog>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=71"></script>
<script src="app.js?v=71"></script>
</body>
</html>
