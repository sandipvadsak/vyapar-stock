<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vyapar Stock</title>
<style>
:root{--side:#1b2540;--side2:#27335a;--ink:#1d2433;--mute:#6b7487;--line:#e3e6ee;--bg:#f3f5fa;--card:#fff;
  --brand:#2f5bea;--sale:#e5484d;--buy:#2f7de1;--good:#12915a;--bad:#d23b3b;--warn:#b7791f}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 "Segoe UI",system-ui,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.hide{display:none!important}
#app{display:grid;grid-template-columns:210px 1fr;height:100%}
#side{background:var(--side);color:#cfd6ea;display:flex;flex-direction:column;overflow:auto}
#side .logo{padding:16px 18px;font-weight:700;font-size:17px;color:#fff;letter-spacing:.2px;border-bottom:1px solid var(--side2)}
#side a{display:block;padding:11px 18px;color:inherit;text-decoration:none;border-left:3px solid transparent}
#side a:hover{background:var(--side2);color:#fff}
#side a.on{background:var(--side2);color:#fff;border-left-color:#ffb020}
#side .who{margin-top:auto;padding:14px 18px;border-top:1px solid var(--side2);font-size:13px}
#side .who b{display:block;color:#fff}
#side .who button{margin-top:8px;background:none;border:1px solid #4a5785;color:#cfd6ea;border-radius:6px;padding:5px 10px;cursor:pointer}
#main{display:flex;flex-direction:column;min-width:0;height:100%}
#top{background:var(--card);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#top h1{font-size:17px;margin-right:auto}
#view{flex:1;overflow:auto;padding:16px 18px}
.btn{border:1px solid var(--line);background:#fff;border-radius:18px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#b9c0d4}
.btn.sale{background:var(--sale);border-color:var(--sale);color:#fff}
.btn.buy{background:var(--buy);border-color:var(--buy);color:#fff}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card .k{color:var(--mute);font-size:12.5px}
.card .v{font-size:20px;font-weight:650;margin-top:4px}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mute{color:var(--mute)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.panel>.hd{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.panel>.hd h2{font-size:15px;margin-right:auto}
.tw{overflow:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--mute);font-weight:600;background:#fafbfe;position:sticky;top:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:#f6f8ff}
.empty{padding:26px;text-align:center;color:var(--mute)}
.split{display:grid;grid-template-columns:300px 1fr;gap:14px;height:100%;min-height:0}
.split>.list{display:flex;flex-direction:column;min-height:0}
.split>.list .rows{overflow:auto;flex:1}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:#f6f8ff}
.row.on{background:#e9eeff}
.row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.split>.det{display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto}
.facts{display:flex;gap:26px;flex-wrap:wrap;padding:12px 14px}
.facts div span{display:block;color:var(--mute);font-size:12px}
.facts div b{font-size:15px}
input,select,textarea{border:1px solid #cfd4e2;border-radius:7px;padding:7px 9px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #b9c8ff;border-color:var(--brand)}
.search{width:100%}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;background:#eef1f8}
.tag.sale{background:#fdeaea;color:#b32b30}.tag.purchase{background:#e6f0fd;color:#1f5fb5}
.tag.sale_return,.tag.purchase_return{background:#fff3da;color:#8a5a00}
.tag.payment_in{background:#e3f6ec;color:#0c7446}.tag.payment_out{background:#f1e9fb;color:#6a3fb0}
dialog{border:none;border-radius:12px;padding:0;width:min(880px,96vw);max-height:94vh;box-shadow:0 20px 60px rgba(20,30,60,.35)}
dialog::backdrop{background:rgba(20,28,50,.45)}
dialog form{display:flex;flex-direction:column;max-height:94vh}
dialog .dh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}
dialog .dh h2{font-size:16px;margin-right:auto}
dialog .db{padding:16px 18px;overflow:auto}
dialog .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;align-items:center}
dialog .err{color:var(--bad);margin-right:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mute)}
label.f input,label.f select,label.f textarea{font-size:14px;color:var(--ink)}
label.c{display:flex;gap:8px;align-items:center;padding:5px 0}
.lines input{width:100%}
.lines td{padding:5px 6px;border-bottom:none}
.lines th{position:static}
.totals{display:flex;justify-content:flex-end;gap:22px;align-items:center;margin-top:12px;flex-wrap:wrap}
.totals b{font-size:17px}
#login{min-height:100%;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#1b2540,#2f447f)}
#login .box{background:#fff;border-radius:14px;padding:26px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
#login h1{font-size:22px}
#login .msg{min-height:20px;font-size:13px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:9px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
#toast.on{opacity:1}
@media (max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  #side{flex-direction:row;align-items:center;overflow-x:auto}
  #side .logo{border:none;padding:10px 12px;font-size:15px;white-space:nowrap}
  #side a{padding:12px 11px;border-left:none;border-bottom:3px solid transparent;white-space:nowrap}
  #side a.on{border-bottom-color:#ffb020}
  #side .who{margin:0 0 0 auto;border:none;padding:6px 12px;white-space:nowrap}
  #side .who b,#side .who span{display:none}
  #side .who button{margin:0}
  .split{grid-template-columns:1fr;height:auto}
  .split>.list .rows{max-height:38vh}
  #view{padding:12px}
}
</style>
</head>
<body>
<div id="login" class="hide">
  <form class="box" id="loginForm">
    <h1 id="loginName">Vyapar Stock</h1>
    <div class="mute" id="loginSub">Sign in to continue</div>
    <label class="f hide" id="nameWrap">Your name<input id="lname" autocomplete="name"></label>
    <label class="f">Email<input id="lemail" type="email" required autocomplete="username"></label>
    <label class="f">Password<input id="lpass" type="password" required minlength="6" autocomplete="current-password"></label>
    <div class="msg" id="lmsg"></div>
    <button class="btn pri" id="lgo">SIGN IN</button>
    <button class="btn" type="button" id="lswap">Create a new account</button>
  </form>
</div>

<div id="app" class="hide">
  <nav id="side">
    <div class="logo" id="brand">Vyapar Stock</div>
    <div id="menu" style="display:contents"></div>
    <div class="who"><b id="whoName"></b><span id="whoRole"></span><br><button id="logout">Sign out</button></div>
  </nav>
  <div id="main">
    <div id="top"><h1 id="title"></h1><div id="actions" style="display:contents"></div></div>
    <div id="view"></div>
  </div>
</div>

<dialog id="dlg"><form id="dform" method="dialog">
  <div class="dh"><h2 id="dtitle"></h2><button class="btn sm" type="button" id="dclose">✕</button></div>
  <div class="db" id="dbody"></div>
  <div class="df"><span class="err" id="derr"></span><span id="dextra" style="display:contents"></span><button class="btn pri" id="dsave">SAVE</button></div>
</form></dialog>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
